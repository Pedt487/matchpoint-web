<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatchPoint</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0C1424; color: #A7B4CA;
         font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  main { width: min(440px, calc(100% - 32px)); text-align: center; }
  h1 { color: #fff; font-size: 22px; margin: 0 0 8px; }
  a { color: #9FC4FF; }
</style>
<script>
  // Die Adresse bleibt auf der Auffangseite stehen, also steht die Kennung
  // noch im Pfad. /oetv/<id> und /t/<id> gehen zur Turnier-Landeseite,
  // /c/<code> zur Einladungsseite -- beide dann mit Status 200.
  (function () {
    var teile = location.pathname.split('/').filter(Boolean);
    var kopf = (teile[0] || '').toLowerCase();
    var wert = teile.length >= 2 ? teile[1] : '';
    if ((kopf === 'oetv' || kopf === 't') && wert) {
      location.replace('/oetv/?id=' + encodeURIComponent(decodeURIComponent(wert)));
    } else if (kopf === 'c' && wert) {
      location.replace('/c/?code=' + encodeURIComponent(decodeURIComponent(wert)));
    }
  })();
</script>
</head>
<body>
<main>
  <h1>Diese Seite gibt es nicht</h1>
  <p>Zur <a href="/">Startseite von MatchPoint</a>.</p>
</main>
</body>
</html>
